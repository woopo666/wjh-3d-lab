name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y libegl1-mesa-dev libgl1-mesa-dri xvfb
      - run: pip install -r requirements.txt
      - run: npm ci
      - run: xvfb-run -a python -m unittest discover -s tests
      - run: node --check browser-stage.mjs && node --check studio.mjs
      - run: npm run build:gallery
      - run: python tools/check_public_files.py
